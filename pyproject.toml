[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impression-oil"
version = "0.0.1"
description = "本机离线的莫奈式印象派油画转换工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "印象油画" }]
dependencies = [
    "PySide6>=6.6,<6.10",
    "Pillow>=10.0,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
impression-oil = "impression_oil.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impression_oil = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
